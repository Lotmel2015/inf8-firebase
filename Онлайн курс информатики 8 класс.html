<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Информатика 8 класс — курс по урокам</title>
<meta name="description" content="Курс информатики для 8 класса: 30 уроков, теория, задачи трёх уровней с проверкой ответов и прогресс.">
<style>:root{
  --ink:#141a24;
  --muted:#5d6675;
  --bg:#f3f4f7;
  --card:#ffffff;
  --line:#e3e6ec;
  --accent:#2f4b8f;
  --accent-soft:#eaeefb;
  --o:#2f4b8f;
  --p:#a86a12;
  --i:#2f6f4f;
  --radius:14px;
  --shadow:0 1px 2px rgba(20,26,36,.05),0 8px 24px -18px rgba(20,26,36,.35);
}
*{box-sizing:border-box}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
html{scroll-behavior:smooth}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;overflow-wrap:break-word;
}
a{color:var(--accent);text-decoration:none}
h1,h2,h3,h4{line-height:1.25;margin:0}
button{font:inherit}

/* ── верхняя панель ───────────────────────────── */
.bar{
  position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:18px;
  height:58px;padding:0 22px;background:rgba(255,255,255,.92);
  border-bottom:1px solid var(--line);backdrop-filter:blur(10px);
}
.logo{
  font-weight:800;font-size:15px;letter-spacing:.02em;color:var(--ink);
  display:inline-flex;align-items:center;gap:2px;
}
.logo span{color:var(--accent)}
.mainnav{display:flex;gap:4px;margin-left:6px}
.mainnav a{
  padding:7px 11px;border-radius:8px;font-size:14px;color:var(--muted);
  transition:background .15s,color .15s;
}
.mainnav a:hover{background:#f1f3f7;color:var(--ink)}
.mainnav a.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.bar-right{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.progress-mini{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.pm-track{width:92px;height:6px;border-radius:99px;background:#e7eaf0;overflow:hidden}
.pm-fill{height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .35s ease}
.burger{display:none}

/* ── каркас ───────────────────────────────────── */
main{max-width:1120px;margin:0 auto;padding:30px 22px 90px;outline:none}
.view{animation:viewIn .3s ease both;min-width:0;max-width:100%}
.panel{min-width:0;max-width:100%}
@keyframes viewIn{from{transform:translateY(8px)}to{transform:none}}
.crumbs{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;color:var(--muted);margin-bottom:14px}
.crumbs a{color:var(--muted)}
.crumbs a:hover{color:var(--accent)}
.crumbs span.sep{opacity:.5}

/* ── главная ──────────────────────────────────── */
.hero{padding:2px 0 18px}
.hero h1{font-size:clamp(26px,3.3vw,37px);letter-spacing:-.02em;max-width:22ch}
.hero p{color:var(--muted);max-width:62ch;margin:12px 0 0;font-size:16.5px}
.hero-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.btn{
  display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:10px;
  border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;
  font-size:14.5px;transition:transform .12s ease,background .15s,border-color .15s;
}
.btn:hover{border-color:#cdd3de}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#274080}
.btn.ghost{background:transparent}
.btn.danger{color:#a12b2b;border-color:#e4c7c7;background:#fdf6f6}
.stats{display:flex;flex-wrap:wrap;gap:26px;margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}
.stat b{display:block;font-size:24px;line-height:1.1;letter-spacing:-.01em}
.stat span{font-size:12.5px;color:var(--muted)}

.mods{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:10px}
.mod{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;
  animation:cardIn .35s ease both;animation-delay:calc(var(--i,0) * 40ms);
}
@keyframes cardIn{from{transform:translateY(10px)}to{transform:none}}
.mod-head{padding:16px 18px 12px;display:flex;gap:12px;align-items:flex-start}
.mod-num{
  flex:0 0 34px;height:34px;border-radius:9px;background:var(--accent-soft);color:var(--accent);
  display:grid;place-items:center;font-weight:700;font-size:14px;
}
.mod-title{font-size:16px;font-weight:650;letter-spacing:-.01em}
.mod-about{color:var(--muted);font-size:13.5px;margin-top:3px}
.mod-hours{margin-left:auto;font-size:12px;color:var(--muted);white-space:nowrap;padding-top:4px}
.mod-list{list-style:none;margin:0;padding:0 8px 8px;flex:1}
.mod-list a{
  display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;
  color:var(--ink);font-size:14px;transition:background .12s;
}
.mod-list a:hover{background:#f6f7fa}
.mod-list a .lid{color:var(--muted);font-size:12.5px;min-width:30px;font-variant-numeric:tabular-nums}
.mod-list a .lt{flex:1;min-width:0}
.mod-list a .lh{font-size:11.5px;color:var(--muted);white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:#d9dde5;flex:0 0 7px}
.dot.done{background:var(--i)}
.mod-foot{padding:10px 18px 14px;border-top:1px solid var(--line);display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted)}
.mod-foot .track{flex:1;height:5px;border-radius:99px;background:#eceff4;overflow:hidden}
.mod-foot .fill{height:100%;background:var(--accent);width:0;border-radius:99px;transition:width .3s}

/* ── урок ─────────────────────────────────────── */
.lesson-head{padding-bottom:6px}
.lesson-head h1{font-size:clamp(23px,3vw,32px);letter-spacing:-.015em;margin-top:4px}
.lesson-meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{
  display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;
  background:#eef0f5;color:var(--muted);font-size:12.5px;white-space:nowrap;
}
.chip.accent{background:var(--accent-soft);color:var(--accent)}
.chip.badge{background:#fdf3e0;color:var(--p);font-weight:600}

.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:22px 0 0;border-bottom:1px solid var(--line);padding-bottom:10px}
.tab{
  padding:8px 14px;border-radius:9px;border:1px solid transparent;background:transparent;
  color:var(--muted);cursor:pointer;font-size:14px;transition:background .15s,color .15s;
}
.tab:hover{background:#eef0f5;color:var(--ink)}
.tab[aria-selected="true"]{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
.panel{padding-top:22px;animation:panelIn .22s ease both}
@keyframes panelIn{from{transform:translateY(6px)}to{transform:none}}

.goal{
  background:var(--card);border:1px solid var(--line);border-left:4px solid var(--accent);
  border-radius:12px;padding:18px 20px;font-size:17px;line-height:1.5;box-shadow:var(--shadow);
}
.lead{color:var(--muted);font-size:14px;margin:6px 0 14px}
.steps{display:grid;gap:12px;margin-top:18px;counter-reset:st}
.step{
  display:flex;gap:14px;background:var(--card);border:1px solid var(--line);
  border-radius:12px;padding:14px 16px;box-shadow:var(--shadow);
  animation:panelIn .25s ease both;animation-delay:calc(var(--i,0) * 45ms);
}
.step .n{
  flex:0 0 26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent);
  display:grid;place-items:center;font-size:13px;font-weight:700;
}
.step p{margin:0;font-size:15px}

.code-block{
  margin-top:18px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fbfbfd;
}
.code-head{display:flex;align-items:center;gap:8px;padding:8px 14px;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted)}
.code-head .dotrow{display:flex;gap:5px}
.code-head .dotrow i{width:8px;height:8px;border-radius:50%;background:#dfe3ea;display:block}
pre{margin:0;padding:14px 16px;overflow-x:auto;font:13.5px/1.6 ui-monospace,SFMono-Regular,Consolas,monospace}
pre code{white-space:pre;overflow-wrap:anywhere}
code{
  font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:.9em;
  background:#eceff4;border-radius:5px;padding:.08em .35em;
}
pre code{background:none;padding:0;font-size:inherit}

.tasklist{display:grid;gap:10px;margin-top:14px}
.task{
  background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;
  box-shadow:var(--shadow);animation:panelIn .25s ease both;animation-delay:calc(var(--i,0) * 35ms);
}
.task.solved{border-color:#cfe4d8;background:#fbfdfc}
.task-head{display:flex;gap:10px;align-items:flex-start}
.tnum{color:var(--muted);font-size:12.5px;min-width:18px;padding-top:2px;font-variant-numeric:tabular-nums}
.tq{flex:1;min-width:0;font-size:15px}
.tq code{font-size:.92em}
.diff{
  flex:0 0 auto;width:24px;height:24px;border-radius:7px;display:grid;place-items:center;
  font-size:12px;font-weight:700;
}
.diff.О{background:var(--accent-soft);color:var(--o)}
.diff.П{background:#fdf3e0;color:var(--p)}
.diff.И{background:#e8f3ec;color:var(--i)}
.task-actions{display:flex;gap:8px;align-items:center;margin-top:10px;padding-left:28px}
.mini{
  font-size:12.5px;padding:5px 11px;border-radius:8px;border:1px solid var(--line);
  background:#fff;color:var(--muted);cursor:pointer;transition:background .15s,color .15s;
}
.mini:hover{background:#f3f5f9;color:var(--ink)}
.mini[aria-expanded="true"]{background:var(--accent-soft);color:var(--accent);border-color:#cdd7f2}
.mini.on{background:#e8f3ec;color:var(--i);border-color:#cfe4d8}
.answer{
  margin-top:10px;padding:11px 14px;border-radius:10px;background:#f7f8fb;
  border:1px dashed #d5dae4;font-size:14px;color:var(--ink);
  animation:panelIn .2s ease both;
}
.answer b{color:var(--i)}

.traps{display:grid;gap:12px;margin-top:16px}
.trap{
  display:flex;gap:12px;padding:14px 16px;background:var(--card);border:1px solid var(--line);
  border-left:4px solid #d9a441;border-radius:12px;font-size:14.5px;
}
.trap .ic{color:#b8842b;font-weight:700}

.lesson-foot{display:flex;gap:10px;justify-content:space-between;margin-top:34px;padding-top:18px;border-top:1px solid var(--line)}
.lesson-foot a{display:flex;flex-direction:column;gap:2px;padding:10px 14px;border:1px solid var(--line);border-radius:11px;background:var(--card);max-width:48%}
.lesson-foot a:hover{border-color:#cdd3de}
.lesson-foot .lbl{font-size:11.5px;color:var(--muted)}
.lesson-foot .ttl{font-size:14px;color:var(--ink);font-weight:600}
.lesson-foot a.next{margin-left:auto;text-align:right}

/* ── задания ──────────────────────────────────── */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:18px 0 6px}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.seg button{
  border:0;background:transparent;padding:7px 13px;font-size:13.5px;color:var(--muted);
  cursor:pointer;border-right:1px solid var(--line);
}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
input[type="search"],select{
  font:inherit;font-size:14px;padding:8px 12px;border:1px solid var(--line);
  border-radius:10px;background:var(--card);color:var(--ink);min-width:0;max-width:100%;
}
.toolbar select{flex:0 1 260px;min-width:0}
.toolbar #qfilter{flex:1 1 200px}
input[type="search"]{flex:1;min-width:180px}
.group-title{display:flex;align-items:baseline;gap:10px;margin:26px 0 4px;font-size:13px;color:var(--muted)}
.group-title b{color:var(--ink);font-size:15px}
.empty{padding:26px;text-align:center;color:var(--muted);background:var(--card);border:1px dashed var(--line);border-radius:12px}

/* ── программа / о курсе ──────────────────────── */
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow)}
.card h3{font-size:16px;margin-bottom:8px}
.card p{margin:0;color:var(--muted);font-size:14.5px}
.kv{display:grid;gap:10px;margin-top:10px}
.kv div{display:flex;gap:10px;font-size:14.5px}
.kv b{min-width:120px;font-weight:600}
.plan-table{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px;table-layout:fixed}
.plan-table th,.plan-table td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top;overflow-wrap:anywhere}
.plan-table th:nth-child(1),.plan-table td:nth-child(1){width:44px}
.plan-table th:nth-child(3),.plan-table td:nth-child(3){width:64px}
.table-scroll{overflow-x:auto}
.plan-table th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600}
.plan-table tr:last-child td{border-bottom:0}
.note{font-size:13px;color:var(--muted);margin-top:10px}

@media (max-width:900px){
  .mods,.grid2{grid-template-columns:1fr}
  .mainnav{
    position:fixed;left:0;right:0;top:58px;flex-direction:column;gap:2px;
    background:#fff;border-bottom:1px solid var(--line);padding:8px;display:none;
    box-shadow:0 12px 24px -18px rgba(0,0,0,.4);z-index:49;
  }
  .mainnav.open{display:flex}
  .burger{display:inline-flex;order:-1}
  .bar{gap:10px}
  main{padding:22px 16px 70px}
  .pm-track{width:60px}
  .lesson-foot a{max-width:100%}
  .lesson-foot{flex-direction:column}
  .lesson-foot a.next{margin-left:0;text-align:left}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  html{scroll-behavior:auto}
}
@media print{
  .bar,.tabs,.task-actions,.lesson-foot,.toolbar{display:none!important}
  body{background:#fff}
  .card,.task,.step,.goal{box-shadow:none;break-inside:avoid}
  .panel{display:block!important}
}

/* ── каркас с деревом курса ───────────────────── */
.shell{display:grid;grid-template-columns:288px minmax(0,1fr);max-width:1400px;margin:0 auto;align-items:start}
main{max-width:900px;margin:0;padding:28px 34px 90px}
.side{
  position:sticky;top:58px;align-self:start;height:calc(100vh - 58px);overflow-y:auto;
  padding:16px 10px 40px;border-right:1px solid var(--line);background:#fbfbfc;
}
.side h2{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 10px;padding-left:8px}
.side .m{margin-bottom:12px}
.side .m>b{display:flex;align-items:baseline;gap:6px;font-size:11.5px;color:var(--muted);font-weight:600;padding:4px 8px 2px}
.side .mp{margin-left:auto;font-size:10.5px;opacity:.8;white-space:nowrap}
.side a{display:flex;gap:7px;align-items:flex-start;padding:5px 8px;border-radius:8px;font-size:13px;color:var(--ink);line-height:1.3}
.side a:hover{background:#eef1f7}
.side a.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.side a .id{font-size:11px;color:var(--muted);min-width:24px;padding-top:1px}
.side a .lt{flex:1;min-width:0}
.side a .dot{margin-top:5px}
.hero-title{font-size:clamp(26px,3.2vw,36px);letter-spacing:-.02em;line-height:1.2;margin:0;max-width:26ch}
.page-h1{font-size:clamp(24px,3vw,32px);letter-spacing:-.015em;margin:4px 0 8px}

/* ── легенда уровней ─────────────────────────── */
.legend{display:flex;flex-wrap:wrap;gap:10px 18px;margin:18px 0 4px;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:12px}
.legend .lg{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.legend .lg b{color:var(--ink);font-weight:600}
.legend .lg .diff{flex:0 0 auto}

/* ── ответ ───────────────────────────────────── */
.answer-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.ainput{
  flex:1 1 240px;min-width:0;font:inherit;font-size:14px;padding:8px 11px;
  border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);
}
.ainput:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
.mini.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.mini.primary:hover{background:#274080;color:#fff}
.feedback{margin-top:8px;font-size:13px;min-height:17px;color:var(--muted)}
.feedback.ok{color:var(--i);font-weight:600}
.feedback.bad{color:#a12b2b}

/* ── теория ──────────────────────────────────── */
.theory{max-width:76ch}
.theory h3{font-size:15.5px;margin:22px 0 6px}
.theory h3:first-child{margin-top:0}
.theory p{margin:9px 0;font-size:15px}
.theory ul{margin:9px 0;padding-left:22px}
.theory li{margin:3px 0;font-size:15px}
.block-table{border-collapse:collapse;width:100%;font-size:13.5px}
.block-table th,.block-table td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
.block-table thead th{background:#f4f1ea;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);font-weight:600}

@media (max-width:1000px){
  html,body{overflow-x:hidden}
  .hstat{display:none}
  .profile-chip{max-width:150px;font-size:11.5px}
  .pm-track{width:50px}
  .theory{max-width:100%}
  .block-table{min-width:0;width:100%}
  .block-table th,.block-table td{white-space:normal;overflow-wrap:anywhere}
  .block-table th{font-size:11px;padding:5px 6px}
  .code-block{max-width:100%}
  .code-block pre,pre.code{display:block;width:100%;max-width:100%;overflow-x:auto;white-space:pre-wrap;word-break:break-word}
  .shell{grid-template-columns:1fr}  .side{
    position:fixed;left:0;top:58px;bottom:0;width:min(86vw,320px);z-index:60;
    transform:translateX(-100%);transition:transform .25s ease;box-shadow:0 18px 40px -20px rgba(0,0,0,.5);
    height:auto;background:#fff;
  }
  .side.open{transform:none}
  main{max-width:100%;padding:20px 16px 70px}
  .toolbar{display:grid;grid-template-columns:1fr;gap:10px;align-items:stretch}
  .toolbar .seg{justify-self:start;flex-wrap:wrap}
  .toolbar select,.toolbar input[type="search"]{width:100%;max-width:100%}
  .legend{display:grid;grid-template-columns:1fr;gap:8px}
}

/* ── дашборд, геймификация, тренировка ───────── */
.bar-right{gap:10px}
.hstat{display:flex;align-items:center;gap:5px;font-size:12.5px;color:var(--muted);white-space:nowrap}
.hstat b{color:var(--ink);font-weight:700}
.dash{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin:6px 0 20px}
.dcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px}
.dcard h3{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0;font-weight:600}
.dcard .big{font-size:20px;font-weight:700;line-height:1.25;letter-spacing:-.01em}
.dcard .sub{font-size:12.5px;color:var(--muted)}
.dcard .act{margin-top:auto;padding-top:10px}
.ring{width:56px;height:56px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p,0)*1%), #e7eaf0 0);display:grid;place-items:center;flex:0 0 56px}
.ring span{width:42px;height:42px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--accent)}
.drow{display:flex;align-items:center;gap:12px}
.ach{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 20px}
.badge{display:flex;align-items:center;gap:7px;padding:7px 11px;border:1px solid var(--line);border-radius:10px;background:var(--card);font-size:12px;color:var(--muted)}
.badge.on{border-color:#cfe4d8;background:#f5faf7;color:var(--ink)}
.badge i{width:22px;height:22px;border-radius:6px;background:#eceff4;display:grid;place-items:center;font-style:normal;font-size:12px;color:var(--muted)}
.badge.on i{background:#dcefe4;color:var(--i)}
.train-wrap{max-width:760px}
.train-top{display:flex;align-items:center;gap:12px;margin:16px 0 10px;font-size:13px;color:var(--muted)}
.train-track{flex:1;height:8px;background:#e7eaf0;border-radius:99px;overflow:hidden}
.train-fill{height:100%;background:var(--accent);border-radius:99px;transition:width .25s}
.train-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 24px;box-shadow:var(--shadow)}
.train-q{font-size:18px;line-height:1.5;margin:8px 0 18px}
.train-foot{display:flex;gap:10px;justify-content:space-between;margin-top:16px}
.hintbox{margin-top:12px;padding:11px 14px;border-radius:10px;background:#fdf7e8;border:1px solid #efdfbc;font-size:13.5px}
.cert{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:34px 30px;max-width:760px;text-align:center}
.cert h2{font-size:24px;margin:0 0 6px;letter-spacing:-.01em}
.cert .lead{margin:4px auto 18px;max-width:52ch}
.cert table{width:100%;border-collapse:collapse;margin:16px 0;font-size:14px}
.cert th,.cert td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left}
.cert .sign{margin-top:18px;font-size:12.5px;color:var(--muted)}
@media (max-width:900px){.dash{grid-template-columns:1fr}}

.btn:disabled,.mini:disabled{opacity:.45;cursor:not-allowed}
.btn:disabled:hover,.mini:disabled:hover{background:var(--card);border-color:var(--line)}

.chip.grade{background:#eef1f7;color:var(--ink);font-weight:700}
.chip.grade.g9,.chip.grade.g8{background:#e8f3ec;color:var(--i)}
.chip.grade.g7,.chip.grade.g6{background:#eef4fb;color:var(--accent)}
.chip.grade.g5,.chip.grade.g4,.chip.grade.g3{background:#fdf3e0;color:var(--p)}
.chip.grade.g2,.chip.grade.g1,.chip.grade.g0{background:#fbeceb;color:#a12b2b}
.grade-big{font-size:52px;font-weight:800;line-height:1;letter-spacing:-.02em}
.grade-scale{font-size:13px;color:var(--muted);margin-top:6px}
.hintbox div{line-height:1.5}
.fmt{font-size:12px;color:var(--muted);margin-top:4px;padding-left:28px}
.honor-badge{background:#e8f3ec;color:var(--i);font-size:13px;font-weight:700;padding:3px 12px;border-radius:99px;vertical-align:middle;letter-spacing:.01em}
.report-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:14px 0 20px}
@media (max-width:700px){.report-grid{grid-template-columns:repeat(2,1fr)}}
.rep-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.rep-card b{display:block;font-size:20px;line-height:1.2}
.rep-card span{font-size:12px;color:var(--muted)}
.profile-chip{font-size:12.5px;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.auth-wrap{display:flex;justify-content:center;padding:34px 0}
.auth-card{max-width:400px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:26px 26px 20px;box-shadow:var(--shadow)}
.auth-card .page-h1{margin-bottom:6px}
.auth-label{display:block;font-size:13px;color:var(--muted);margin:14px 0 5px}
.auth-card .ainput{width:100%;box-sizing:border-box}
.auth-divider{text-align:center;color:var(--muted);font-size:12.5px;margin:18px 0 4px;position:relative}
.auth-divider::before,.auth-divider::after{content:"";position:absolute;top:50%;width:38%;height:1px;background:var(--line)}
.auth-divider::before{left:0}.auth-divider::after{right:0}
.auth-tabs{display:flex;gap:6px;background:#f1f3f7;border-radius:11px;padding:4px;margin:14px 0 4px}
.auth-tab{flex:1;border:0;background:transparent;padding:8px 10px;border-radius:8px;font:inherit;font-size:14px;color:var(--muted);cursor:pointer;transition:background .15s,color .15s}
.auth-tab[aria-selected="true"]{background:#fff;color:var(--accent);font-weight:600;box-shadow:var(--shadow)}
.auth-tab:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.auth-pane{margin-top:6px}
.detail-row td{background:#fafafc;padding:2px 16px 10px}
.detail-box{font-size:12.5px;color:var(--muted);background:#f4f5f8;border:1px solid var(--line);border-radius:8px;padding:8px 10px;line-height:1.55}
.vpr-link{margin-left:auto;font-size:12.5px;color:var(--accent);font-weight:600;text-decoration:none;white-space:nowrap}
.ex-block{margin-top:24px;display:grid;gap:12px}
.ex-block h3{margin:0 0 4px}
.ex-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow);animation:panelIn .25s ease both;animation-delay:calc(var(--i,0)*60ms)}
.ex-head{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.ex-src{font-size:12px;color:var(--muted)}
.ex-card p{margin:0;font-size:15px}
.ex-card pre{margin:10px 0 0}
.code-exp{margin:12px 0 0;padding:12px 16px 12px 34px;background:#f7f8fb;border:1px dashed #d5dae4;border-radius:10px;font-size:14px;display:grid;gap:6px}
.code-exp li{margin:0;overflow-wrap:anywhere}
.theory pre{overflow-x:auto;max-width:100%}
.code-block{overflow-x:auto}
.theory .code-block{max-width:100%;overflow-x:auto}
.code-block pre{overflow-x:auto;max-width:100%}
.vpr-link:hover{text-decoration:underline}
.scale9,.scale16{display:flex;gap:4px;justify-content:center;margin:14px 0 4px;flex-wrap:wrap}
.scale9 i,.scale16 i{display:block;width:22px;height:8px;border-radius:99px;background:#e7eaf0}
.scale16 i{width:14px}
.scale9 i.on{background:var(--accent)}
.scale16 i.on{background:var(--accent)}

@media (max-width:700px){
  .cert{padding:20px 14px}
  .cert table{table-layout:fixed;font-size:12px}
  .cert th,.cert td{padding:6px 5px;overflow-wrap:anywhere}
  .cert .table-wrap{max-width:100%;overflow-x:auto}
  .grade-big{font-size:42px}
}

.scale9{display:flex;gap:5px;justify-content:center;margin:14px 0 4px}
.scale9 i{display:block;width:26px;height:8px;border-radius:99px;background:#e7eaf0}
.scale9 i.on{background:var(--accent)}
</style>
